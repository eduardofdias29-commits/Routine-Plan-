<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sessao.js') }}"></script>
</head>
<body>

    <main>
        <div class="cabecalho-pagina">
            <p class="rotulo">Registros</p>
            <h1>Histórico</h1>
        </div>

        <section class="card">
            <div class="rotulo-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF7A33" stroke-width="2"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
                <span style="color: var(--treino);">Registrar treino</span>
            </div>

            <div class="campos-registro">
                <div class="campo-registro">
                    <p class="rotulo-campo">Data</p>
                    <input type="date" id="input-data-treino-manual">
                </div>
                <div class="campo-registro">
                    <p class="rotulo-campo">Treino</p>
                    <select id="select-modelo-treino-manual"></select>
                </div>
            </div>

            <button class="botao-registro treino" onclick="registrarTreinoManual()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                Registrar treino
            </button>
        </section>

        <section class="card">
            <div class="rotulo-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ECFB8" stroke-width="2"><path d="M13 4l-3 6 4 2-2 8M9 10L5 8m10 12l3-4-3-2"/></svg>
                <span style="color: var(--corrida);">Registrar corrida</span>
            </div>

            <div class="campos-registro">
                <div class="campo-registro largo">
                    <p class="rotulo-campo">Data</p>
                    <input type="date" id="input-data-corrida-manual">
                </div>
                <div class="campo-registro">
                    <p class="rotulo-campo">Distância (km)</p>
                    <input type="number" id="input-km-corrida-manual" placeholder="0.00" step="0.01">
                </div>
                <div class="campo-registro">
                    <p class="rotulo-campo">Duração (min)</p>
                    <input type="number" id="input-duracao-corrida-manual" placeholder="0">
                </div>
            </div>

            <button class="botao-registro corrida" onclick="registrarCorridaManual()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                Registrar corrida
            </button>
        </section>

        <p class="titulo-secundario">Atividades consolidadas</p>
        <div id="lista-historico">
            <p style="color: var(--text-muted); font-size: 13px;">Carregando...</p>
        </div>

        <nav class="menu-inferior">
            <a href="/">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
                Início
            </a>
            <a href="/treinos">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
                Treinos
            </a>
            <a href="/biblioteca">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h10v16H10z"/></svg>
                Biblioteca
            </a>
            <a href="/corrida">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 4l-3 6 4 2-2 8M9 10L5 8m10 12l3-4-3-2"/></svg>
                Corrida
            </a>
            <a href="/historico" class="ativo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                Histórico
            </a>
            <a href="/perfil">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                Perfil
            </a>
        </nav>
    </main>

    <script src="{{ url_for('static', filename='js/historico.js') }}"></script>
</body>
</html>
