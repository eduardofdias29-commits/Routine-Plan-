<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoutinePlan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sessao.js') }}"></script>
</head>
<body>

    <main>
        <div class="saudacao">
            <p class="saudacao-data" id="texto-data"></p>
            <h1 id="texto-saudacao">Olá,<br><span class="nome-destaque" id="texto-nome"></span></h1>
        </div>

        <div id="alerta-agua" class="alerta-agua escondido"></div>

        <nav class="atalhos">
            <a href="/treinos" class="atalho">
                <div class="atalho-icone cor-treino">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF7A33" stroke-width="2"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
                </div>
                <span>Treinos</span>
            </a>
            <a href="/biblioteca" class="atalho">
                <div class="atalho-icone cor-biblioteca">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4DA8FF" stroke-width="2"><path d="M4 4h4v16H4zM10 4h10v16H10z"/></svg>
                </div>
                <span>Biblioteca</span>
            </a>
            <a href="/corrida" class="atalho">
                <div class="atalho-icone cor-corrida">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3ECFB8" stroke-width="2"><path d="M13 4l-3 6 4 2-2 8M9 10L5 8m10 12l3-4-3-2"/></svg>
                </div>
                <span>Corrida</span>
            </a>
            <a href="/historico" class="atalho">
                <div class="atalho-icone cor-historico">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A78BFA" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                </div>
                <span>Histórico</span>
            </a>
            <a href="/perfil" class="atalho">
                <div class="atalho-icone cor-perfil">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B92A1" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                </div>
                <span>Perfil</span>
            </a>
        </nav>

        <div class="bloco-agua">
            <div class="rotulo-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4DA8FF" stroke-width="2"><path d="M12 2s7 8 7 13a7 7 0 01-14 0c0-5 7-13 7-13z"/></svg>
                <span style="color: var(--agua);">Hidratação</span>
            </div>
            <div class="bloco-agua-conteudo">
                <div class="anel-agua">
                    <svg width="92" height="92" viewBox="0 0 92 92">
                        <circle class="anel-trilho" cx="46" cy="46" r="40" fill="none" stroke="#232833" stroke-width="8"/>
                        <circle id="circulo-progresso" cx="46" cy="46" r="40" fill="none" stroke="#4DA8FF" stroke-width="8"
                                stroke-dasharray="251" stroke-dashoffset="251" stroke-linecap="round"/>
                    </svg>
                    <div class="anel-agua-texto">
                        <span class="pct" id="percentual-agua">0%</span>
                        <span class="litros" id="litros-agua">0.0L</span>
                    </div>
                </div>
                <div style="flex: 1;">
                    <p class="agua-valor"><span id="agua-total">0</span><span class="unidade">ml</span></p>
                    <p class="agua-meta-texto">de <span id="agua-meta">4000</span>ml</p>
                    <div class="botoes-agua">
                        <button class="botao-agua-menos" onclick="registrarAgua(-300)">− 300ml</button>
                        <button class="botao-agua-neutro" onclick="registrarAgua(300)">+ 300ml</button>
                        <button class="botao-agua-destaque" onclick="registrarAgua(500)">+ 500ml</button>
                    </div>
                </div>
            </div>
        </div>

        <section class="secao" id="secao-treino">
            <div class="rotulo-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF7A33" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
                <span style="color: var(--treino);">Treino de Hoje</span>
            </div>
            <div id="treino-hoje">
                <p style="color: var(--text-muted); font-size: 14px;">Carregando...</p>
            </div>
        </section>

        <section class="secao">
            <div class="rotulo-card">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ECFB8" stroke-width="2"><path d="M13 4l-3 6 4 2-2 8M9 10L5 8m10 12l3-4-3-2"/></svg>
                <span style="color: var(--corrida);">Corrida da Semana</span>
            </div>
            <div class="linha-meta-corrida">
                <div class="stat-linha">
                    <span class="valor" id="km-semana">0</span>
                    <span class="unidade">km</span>
                </div>
                <span class="meta-texto">meta <span id="km-meta">10</span>km</span>
            </div>
            <div class="barra-progresso-fina">
                <div class="preenchimento" id="barra-corrida" style="width: 0%;"></div>
            </div>
            <a href="/corrida" class="botao botao-primario" style="width: 100%; background-color: var(--corrida);">Iniciar corrida</a>
        </section>

        <nav class="menu-inferior">
            <a href="/" class="ativo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
                Início
            </a>
            <a href="/treinos">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
                Treinos
            </a>
            <a href="/biblioteca">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h10v16H10z"/></svg>
                Biblioteca
            </a>
            <a href="/corrida">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 4l-3 6 4 2-2 8M9 10L5 8m10 12l3-4-3-2"/></svg>
                Corrida
            </a>
            <a href="/historico">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                Histórico
            </a>
            <a href="/perfil">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
                Perfil
            </a>
        </nav>
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
